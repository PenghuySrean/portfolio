<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8431d"/>
    </marker>
  </defs>
  <rect width="1500" height="420" fill="#ffffff"/>
  <g font-size="26" font-weight="600" fill="#1c2333" text-anchor="middle">
    <text x="140" y="52">Trajectory</text>
    <text x="430" y="52">Arcs</text>
    <text x="720" y="52">Cell passages</text>
    <text x="1010" y="52">Debris environment</text>
    <text x="1330" y="52">Risk metrics</text>
  </g>

  <!-- 1 trajectory -->
  <rect x="30" y="80" width="220" height="250" rx="14" fill="#e8f1fb" stroke="#9db8d6"/>
  <path d="M95,115 C62,200 62,260 115,305" fill="none" stroke="#7a8696" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="140" y="365" font-size="20" fill="#3a4559" text-anchor="middle">mission trajectory</text>
  <text x="140" y="390" font-size="20" fill="#3a4559" text-anchor="middle">(OEM state history)</text>

  <!-- 2 arcs -->
  <rect x="320" y="80" width="220" height="250" rx="14" fill="#e8f1fb" stroke="#9db8d6"/>
  <g fill="none" stroke="#1f6aa5" stroke-width="6" stroke-linecap="round">
    <path d="M385,115 C425,155 445,195 435,225" marker-end="url(#a)"/>
    <path d="M435,235 C455,270 445,300 420,318" marker-end="url(#a)"/>
  </g>
  <text x="430" y="365" font-size="20" fill="#3a4559" text-anchor="middle">split into locally</text>
  <text x="430" y="390" font-size="20" fill="#3a4559" text-anchor="middle">Keplerian arcs</text>

  <!-- 3 cell passages -->
  <rect x="610" y="80" width="220" height="250" rx="14" fill="#e8f1fb" stroke="#9db8d6"/>
  <g transform="translate(720,205)" fill="none" stroke="#6b7a90" stroke-width="2">
    <circle r="100"/><circle r="76"/><circle r="52"/><circle r="30"/>
    <path d="M0,-100 V100 M-100,0 H100 M-70,-70 L70,70 M70,-70 L-70,70"/>
    <circle r="12" fill="#5db4e6" stroke="#3b8fbf"/>
    <path d="M-28,-95 C36,-62 64,-18 36,54 C22,86 8,96 -5,99" stroke="#1f6aa5" stroke-width="5" marker-end="url(#a)"/>
  </g>
  <text x="720" y="365" font-size="20" fill="#3a4559" text-anchor="middle">crossings of a spatial grid</text>
  <text x="720" y="390" font-size="20" fill="#3a4559" text-anchor="middle">over the protected region</text>

  <!-- 4 debris -->
  <rect x="900" y="80" width="220" height="250" rx="14" fill="#e8f1fb" stroke="#9db8d6"/>
  <path d="M960,125 L1060,125 L1075,160 L945,160 Z" fill="#f2b180" stroke="#d88a55"/>
  <g fill="#8a8f99">
    <circle cx="965" cy="205" r="5"/><circle cx="1010" cy="190" r="4"/><circle cx="1050" cy="215" r="6"/>
    <circle cx="985" cy="250" r="4"/><circle cx="1035" cy="265" r="5"/><circle cx="1075" cy="245" r="3"/>
    <circle cx="940" cy="285" r="3"/><circle cx="1000" cy="300" r="5"/>
  </g>
  <text x="1010" y="365" font-size="20" fill="#3a4559" text-anchor="middle">statistical debris flux</text>
  <text x="1010" y="390" font-size="20" fill="#3a4559" text-anchor="middle">from ESA’s MASTER model</text>

  <!-- 5 metrics -->
  <rect x="1190" y="80" width="280" height="250" rx="14" fill="#e8f1fb" stroke="#9db8d6"/>
  <rect x="1206" y="98" width="248" height="64" rx="10" fill="#e6d4fb"/>
  <text x="1330" y="138" font-size="22" fill="#6a2fb3" text-anchor="middle">Collision probability</text>
  <rect x="1206" y="176" width="248" height="64" rx="10" fill="#fde3cb"/>
  <text x="1330" y="216" font-size="22" fill="#b8620f" text-anchor="middle">Catastrophic fraction</text>
  <rect x="1206" y="254" width="248" height="64" rx="10" fill="#f8d4d8"/>
  <text x="1330" y="294" font-size="22" fill="#b3283a" text-anchor="middle">Unmitigable fraction</text>
  <text x="1330" y="365" font-size="20" fill="#3a4559" text-anchor="middle">per cell and per mission</text>

  <g stroke="#c8431d" stroke-width="5" fill="none" marker-end="url(#a)">
    <path d="M254,205 H316"/>
    <path d="M544,205 H606"/>
    <path d="M834,205 H896"/>
    <path d="M1124,205 H1186"/>
  </g>
</svg>
