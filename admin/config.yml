  - name: certificates
    label: "Award certificates"
    files:
      - name: certificates
        label: "Certificates"
        file: content/certificates.json
        format: json
        fields:
          - { label: "Airbus Sloshing Rocket (Top 3, 2024)", name: airbus_top3, widget: file, required: false }
          - { label: "International Space Challenge (Distinction Award, 2022)", name: isc_distinction, widget: file, required: false }

  - name: profile
    label: "Profile photo"
    files:
      - name: profile
        label: "Profile photo"
        file: content/profile.json
        format: json
        fields:
          - { label: "Photo (shown in About)", name: photo, widget: image, required: false, hint: "Tip: crop it first at /portfolio/admin/crop.html. It makes a small square copy that uploads fast." }
          - { label: "Photo: left/right position (0 = left, 50 = centre, 100 = right)", name: focus_x, widget: number, value_type: int, min: 0, max: 100, default: 50, required: false }
          - { label: "Photo: up/down position (0 = top, 50 = centre, 100 = bottom)", name: focus_y, widget: number, value_type: int, min: 0, max: 100, default: 50, required: false }
          - { label: "Photo: zoom in (100 = whole photo, 200 = twice as close)", name: zoom, widget: number, value_type: int, min: 100, max: 300, default: 100, required: false }

  - name: making
    label: Artmaking
    label_singular: Item
    folder: making
    create: true
    extension: md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{category}}: {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - label: Category
        name: category
        widget: select
        options: [Sketch, Drawing, Photography, Poetry, Music]
        default: Sketch
      - { label: Image, name: image, widget: image, required: false }
      - label: "More images (shown together in one row, 4 across)"
        name: gallery
        widget: list
        required: false
        hint: "Add up to 4 images. They appear in one row of 4 on a computer and in 2 x 2 on a phone."
        field: { label: Image, name: image, widget: image }
      - { label: "Link (for music: YouTube, SoundCloud...)", name: link, widget: string, required: false }
      - label: "Images per row (when you put several images together)"
        name: columns
        widget: select
        options: ["Auto", "1", "2", "3", "4"]
        default: "Auto"
        required: false
        hint: "Auto puts consecutive images side by side (up to 4). Choose 1 to stack them one under another."
      - { label: "Text (a poem, or a few words)", name: body, widget: markdown, required: false }

  - name: artmaking_pages
    label: "Artmaking intro lines"
    files:
      - name: artmaking
        label: "Intro lines"
        file: content/artmaking.json
        format: json
        fields:
          - { label: "Sketch: one line (or a short paragraph) shown above the sketches", name: intro_sketch, widget: text, required: false }
