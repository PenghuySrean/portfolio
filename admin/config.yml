backend:
  name: github
  repo: PenghuySrean/portfolio
  branch: main
  # GitHub Pages has no OAuth server. Use a repository-scoped token so the
  # editor can create commits instead of failing only when an entry is saved.
  auth_methods: [token]

site_url: https://penghuysrean.github.io/portfolio/
display_url: https://penghuysrean.github.io/portfolio/musing.html
media_folder: uploads
public_folder: /portfolio/uploads

# Photos are resized and converted in the browser before upload,
# so large originals work and the saved files stay small but sharp.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 2400
          height: 2400

collections:
  - name: musing
    label: Musing
    label_singular: Post
    folder: posts
    create: true
    extension: md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - label: Tag
        name: tag
        widget: select
        options: [Thought, Opinion, Experience, Space, Book, Poem]
        default: Thought
      - { label: Image, name: image, widget: image, required: false }
      - { label: Text, name: body, widget: markdown }
