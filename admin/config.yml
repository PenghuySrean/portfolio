backend:
  name: github
  repo: PenghuySrean/portfolio
  branch: main

site_url: https://penghuysrean.github.io/portfolio/
display_url: https://penghuysrean.github.io/portfolio/musing.html

media_folder: uploads
public_folder: /portfolio/uploads

# Photos are resized and converted in the browser before upload,
# so large originals work and the saved files stay small but sharp.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: musing
    label: Musing
    label_singular: Post
    folder: posts
    create: true
    extension: md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - label: Tag
        name: tag
        widget: select
        options: [Thought, Opinion, Experience, Space, Book, Poem]
        default: Thought
      - { label: Image, name: image, widget: image, required: false }
      - label: "Images per row (when you put several images together)"
        name: columns
        widget: select
        options: ["Auto", "1", "2", "3", "4"]
        default: "Auto"
        required: false
        hint: "Auto puts consecutive images side by side (up to 4). Choose 1 to stack them one under another."
      - { label: Text, name: body, widget: markdown }

  - name: projects
    label: "Engineering projects"
    files:
      - name: lunar-transfers
        label: "Interplanetary collision risk analysis"
        file: content/projects/lunar-transfers.md
        fields:
          - { label: Title, name: title, widget: hidden, default: "Interplanetary collision risk analysis" }
          - { label: "Demo video link (YouTube or Vimeo, optional)", name: demo, widget: string, required: false }
          - { label: "Tools (comma separated, e.g. Python, KiCad)", name: tools, widget: string, required: false }
          - { label: "Skills (comma separated, e.g. Sensor fusion, Link budget)", name: skills, widget: string, required: false }
          - { label: "Details, images and videos", name: body, widget: markdown, hint: "Write the story. Add images or videos exactly where they belong, in the order you want. A YouTube or Vimeo link on its own line becomes a video player." }
      - name: tubin-imagery
