backend:
  name: github
  repo: PenghuySrean/portfolio
  branch: main

site_url: https://penghuysrean.github.io/portfolio/
display_url: https://penghuysrean.github.io/portfolio/musing.html
locale: en

media_folder: uploads
public_folder: /portfolio/uploads

collections:
  - name: musing
    label: Musing
    label_singular: Post
    folder: posts
    create: true
    extension: md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - label: Tag
        name: tag
        widget: select
        options: [Thought, Opinion, Experience, Space, Book, Poem]
        default: Thought
      - { label: Image, name: image, widget: image, required: false }
      - { label: Text, name: body, widget: markdown }
