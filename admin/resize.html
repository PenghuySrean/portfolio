<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Resize photos · Penghuy Srean</title>
    <style>
      :root { --bg:#0a0a0a; --panel:#0b0c0f; --border:#30343a; --text:#f2f1ed; --body:#9aa8c5; --accent:#ff7043; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font-size: 1.6rem; font-weight: 500; margin: 0 0 6px; }
      p { color: var(--body); margin: 0 0 18px; }
      .step { color: var(--accent); font: 400 11px ui-monospace, Consolas, monospace; letter-spacing: .05em; text-transform: uppercase; margin: 22px 0 8px; }
      input[type=file] { width: 100%; padding: 12px; background: var(--panel); color: var(--text); border: 1px solid var(--border); }
      button { padding: 12px 18px; background: var(--accent); color: #000; border: 0; font: 600 12px ui-monospace, Consolas, monospace; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
      button:disabled { opacity: .4; cursor: default; }
      ul { list-style: none; margin: 16px 0 0; padding: 0; }
      li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); color: var(--body); font-size: .95rem; }
      li img { width: 56px; height: 56px; object-fit: cover; border: 1px solid var(--border); }
      li a { color: var(--accent); margin-left: auto; white-space: nowrap; }
      #msg { color: var(--accent); min-height: 1.4em; margin-top: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Resize photos</h1>
      <p>Choose one or more photos. Each is made smaller (longest side 1600 px, high quality) and keeps its own shape. Then upload the small copies in the admin page. Everything happens in your browser.</p>

      <div class="step">1 · Choose photos (you can select several)</div>
      <input id="files" type="file" accept="image/*,.heic,.heif,.avif,.webp,.tif,.tiff,.bmp,.gif,.jpg,.jpeg,.png" multiple />

      <div class="step">2 · Download the small copies</div>
      <button id="all" disabled>Download all</button>
      <p id="msg" role="status"></p>
      <ul id="list"></ul>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <script>
      const MAX = 1600, QUALITY = 0.88;
      const input = document.getElementById("files");
      const list = document.getElementById("list");
      const allBtn = document.getElementById("all");
      const msg = document.getElementById("msg");
      let results = [];

      const isHeic = (f) => /heic|heif/i.test(f.type) || /\.(heic|heif)$/i.test(f.name);
      const toDecodable = async (file) => {
        if (!isHeic(file)) return file;
        if (!window.heic2any) throw new Error("HEIC converter not loaded");
        const out = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.92 });
        return Array.isArray(out) ? out[0] : out;
      };
      const load = async (file) => {
        const src = await toDecodable(file);
        return new Promise((res, rej) => {
          const url = URL.createObjectURL(src);
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = () => rej(new Error("Cannot read " + file.name));
          im.src = url;
        });
      };

      input.addEventListener("change", async () => {
        results = [];
        list.innerHTML = "";
        allBtn.disabled = true;
        const files = [...input.files];
        let n = 0;
        for (const f of files) {
          msg.textContent = "Resizing " + (++n) + " of " + files.length + "...";
          try {
            const im = await load(f);
            const k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
            const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
            const c = document.createElement("canvas");
            c.width = w; c.height = h;
            const g = c.getContext("2d");
            g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
            g.imageSmoothingQuality = "high";
            g.drawImage(im, 0, 0, w, h);
            const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", QUALITY));
            const name = f.name.replace(/\.[^.]+$/, "") + "-small.jpg";
            const url = URL.createObjectURL(blob);
            results.push({ name, url });
            const li = document.createElement("li");
            li.innerHTML = '<img src="' + url + '" alt="" /><span>' + name + "<br>" + w + " × " + h + " px, " + Math.round(blob.size / 1024) + " KB (was " + (f.size / 1048576).toFixed(1) + " MB)</span>";
            const a = document.createElement("a");
            a.href = url; a.download = name; a.textContent = "Download";
            li.appendChild(a);
            list.appendChild(li);
          } catch (e) {
            const li = document.createElement("li");
            li.textContent = "Could not read " + f.name + ". Try exporting it as JPEG from your photo app, then choose that file.";
            list.appendChild(li);
          }
        }
        msg.textContent = results.length ? "Done. " + results.length + " small photo(s) ready." : "Nothing could be resized.";
        allBtn.disabled = !results.length;
      });

      allBtn.addEventListener("click", async () => {
        for (const r of results) {
          const a = document.createElement("a");
          a.href = r.url; a.download = r.name;
          document.body.appendChild(a); a.click(); a.remove();
          await new Promise((res) => setTimeout(res, 400));
        }
      });
    </script>
  </body>
</html>
